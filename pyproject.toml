[project]
name = "multi-agent-research-system"
version = "0.2.0"
description = "Multi-agent AI research system that searches, scrapes, writes, and critiques research reports using LangChain and Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "diskcache>=5.6.0",
    "fpdf2>=2.7.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
    "tavily-python>=0.5.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
